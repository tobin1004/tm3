
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>인물별 동물상 테스트</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            padding: 10px;
            background-color: #f5f7fa;
        }

        h2 {
            color: #333;
        }

        p {
            color: #6118af;
            line-height: 1.6;
        }

        #preview {
            display: none;
            max-width: 300px;
            max-height: 300px;
            width: auto;
            height: auto;
            margin: 20px auto;
            border-radius: 10px;
            object-fit: contain;
        }

        input[type="file"] {
            max-width: 100%;
            margin: 15px;
        }

        button {
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #3366cc;
            color: white;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #status {
            margin: 15px;
            color: #666;
            font-size: 14px;
        }

        #result {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #3366cc;
        }

        #label-container {
            margin: 25px auto;
            max-width: 400px;
            font-size: 16px;
            text-align: left;
        }

        .result-item {
            margin: 15px 0;
        }

        .result-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .progress {
            width: 100%;
            height: 18px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: #4caf50;
            transition: width 0.3s;
        }

        #image-info {
            color: #777;
            font-size: 12px;
            line-height: 1.7;
        }

        @media (max-width: 600px) {
            body {
                margin: 10px;
            }

            #preview {
                max-width: 90%;
                max-height: 300px;
            }

            button {
                width: 85%;
            }
        }
    </style>
</head>

<body>

    <h2>🐶 동물상 테스트 🦊</h2>

    <p>
        [파일 선택]을 누르고 본인 사진이나<br>
        나와 닮은 연예인 사진을 업로드하세요.
    </p>

    <!-- 이미지 업로드 -->
    <input
        type="file"
        id="image-upload"
        accept="image/*"
    >

    <br>

    <!-- 이미지 미리보기 -->
    <img
        id="preview"
        alt="업로드 이미지 미리보기"
    >

    <div id="image-info"></div>

    <br>

    <!-- 분석 버튼 -->
    <button
        type="button"
        id="analyze-button"
        disabled
    >
        동물상 분석하기
    </button>

    <!-- 모델 상태 -->
    <div id="status">
        AI 모델을 불러오는 중입니다...
    </div>

    <!-- 최종 결과 -->
    <div id="result"></div>

    <!-- 클래스별 확률 -->
    <div id="label-container"></div>


    <script>

        // =====================================
        // 1. 모델 설정
        // =====================================

        const MODEL_URL = "./my_model/";

        // Teachable Machine 기본 이미지 입력 크기
        const IMAGE_SIZE = 224;

        let model = null;

        let modelReady = false;
        let imageReady = false;
        let isAnalyzing = false;

        let currentObjectURL = null;


        // =====================================
        // 2. HTML 요소 가져오기
        // =====================================

        const uploadInput =
            document.getElementById("image-upload");

        const preview =
            document.getElementById("preview");

        const analyzeButton =
            document.getElementById("analyze-button");

        const status =
            document.getElementById("status");

        const result =
            document.getElementById("result");

        const labelContainer =
            document.getElementById("label-container");

        const imageInfo =
            document.getElementById("image-info");


        // =====================================
        // 3. 분석 버튼 상태 관리
        // =====================================

        function updateButton() {

            analyzeButton.disabled =
                !modelReady ||
                !imageReady ||
                isAnalyzing;

        }


        // =====================================
        // 4. AI 모델 로딩
        // =====================================

        async function init() {

            try {

                status.textContent =
                    "TensorFlow.js 초기화 중...";

                // PC와 모바일의 연산 백엔드 통일
                await tf.setBackend("cpu");

                // TensorFlow 초기화 완료 대기
                await tf.ready();

                console.log(
                    "TensorFlow Backend:",
                    tf.getBackend()
                );

                status.textContent =
                    "AI 모델을 불러오는 중입니다...";

                const modelURL =
                    MODEL_URL + "model.json";

                const metadataURL =
                    MODEL_URL + "metadata.json";

                // Teachable Machine 모델 로딩
                model = await tmImage.load(
                    modelURL,
                    metadataURL
                );

                modelReady = true;

                console.log("모델 로딩 완료");

                console.log(
                    "클래스 목록:",
                    model.getClassLabels()
                );

                console.log(
                    "TensorFlow Backend:",
                    tf.getBackend()
                );

                status.textContent =
                    "모델 로딩 완료! 이미지를 업로드하세요.";

                updateButton();

            } catch (error) {

                console.error(
                    "모델 로딩 오류:",
                    error
                );

                status.textContent =
                    "모델 로딩에 실패했습니다.";

                alert(
                    "AI 모델을 불러오지 못했습니다. 모델 폴더를 확인하세요."
                );

            }

        }


        // =====================================
        // 5. 이미지 업로드
        // =====================================

        uploadInput.addEventListener(
            "change",
            async function(event) {

                const file = event.target.files[0];

                if (!file) return;

                // 이미지 파일 확인
                if (!file.type.startsWith("image/")) {

                    alert("이미지 파일만 업로드할 수 있습니다.");

                    uploadInput.value = "";

                    return;

                }

                // 이전 결과 초기화
                result.textContent = "";

                labelContainer.innerHTML = "";

                imageInfo.textContent = "";

                imageReady = false;

                updateButton();

                try {

                    // 이전 임시 URL 해제
                    if (currentObjectURL) {

                        URL.revokeObjectURL(
                            currentObjectURL
                        );

                    }

                    // 새로운 이미지 URL 생성
                    currentObjectURL =
                        URL.createObjectURL(file);

                    // 이미지 미리보기
                    preview.src = currentObjectURL;

                    preview.style.display = "block";

                    // 이미지 디코딩 완료 대기
                    await preview.decode();

                    // 이미지 정보
                    const width = preview.naturalWidth;
                    const height = preview.naturalHeight;

                    if (width === 0 || height === 0) {

                        throw new Error(
                            "이미지 크기를 확인할 수 없습니다."
                        );

                    }

                    imageReady = true;

                    imageInfo.textContent =
                        `원본 크기: ${width} × ${height}`;

                    status.textContent =
                        "이미지 업로드 완료! 분석할 수 있습니다.";

                    console.log("업로드 파일:", file.name);

                    console.log(
                        "파일 크기:",
                        file.size,
                        "bytes"
                    );

                    console.log(
                        "이미지 실제 크기:",
                        width,
                        height
                    );

                    updateButton();

                } catch (error) {

                    console.error(
                        "이미지 업로드 오류:",
                        error
                    );

                    status.textContent =
                        "이미지를 불러오지 못했습니다.";

                    alert(
                        "이미지를 읽을 수 없습니다. JPG 또는 PNG 파일을 사용해 주세요."
                    );

                    imageReady = false;

                    updateButton();

                }

            }
        );


        // =====================================
        // 6. 이미지 전처리
        // =====================================

        function preprocessImage(image) {

            // 정사각형 Canvas 생성
            const canvas =
                document.createElement("canvas");

            canvas.width = IMAGE_SIZE;
            canvas.height = IMAGE_SIZE;

            const ctx = canvas.getContext("2d", {
                alpha: false
            });

            if (!ctx) {

                throw new Error(
                    "Canvas를 생성할 수 없습니다."
                );

            }

            const width = image.naturalWidth;
            const height = image.naturalHeight;

            // 중앙 크롭을 위한 정사각형 영역 계산
            const size = Math.min(width, height);

            const sx = (width - size) / 2;
            const sy = (height - size) / 2;

            // 이미지 품질 설정
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";

            // 중앙 영역을 224 × 224로 변환
            ctx.drawImage(
                image,
                sx,
                sy,
                size,
                size,
                0,
                0,
                IMAGE_SIZE,
                IMAGE_SIZE
            );

            console.log(
                "전처리 이미지 크기:",
                canvas.width,
                canvas.height
            );

            return canvas;

        }


        // =====================================
        // 7. AI 이미지 분석
        // =====================================

        async function predictImage() {

            if (!model || !modelReady) {

                alert("AI 모델을 불러오는 중입니다.");

                return;

            }

            if (!imageReady) {

                alert("먼저 이미지를 업로드하세요.");

                return;

            }

            if (isAnalyzing) return;

            try {

                isAnalyzing = true;

                updateButton();

                result.textContent = "";

                labelContainer.innerHTML = "";

                status.textContent =
                    "AI가 이미지를 분석하고 있습니다...";

                // 이미지 디코딩 완료 확인
                await preview.decode();

                // 이미지 전처리
                const canvas =
                    preprocessImage(preview);

                // 실행 환경 확인
                console.log(
                    "현재 Backend:",
                    tf.getBackend()
                );

                // Teachable Machine 예측
                const prediction =
                    await model.predict(canvas);

                console.log(
                    "AI 전체 예측 결과:"
                );

                console.table(prediction);

                // =================================
                // 가장 높은 확률의 클래스 찾기
                // =================================

                const sortedPrediction =
                    [...prediction].sort(
                        (a, b) =>
                            b.probability - a.probability
                    );

                const bestPrediction =
                    sortedPrediction[0];

                const animal =
                    bestPrediction.className;

                const probability =
                    bestPrediction.probability;

                // =================================
                // 최종 결과 출력
                // =================================

                result.innerHTML =
                    `당신은 "${animal}"상입니다!<br>
                    (${(probability * 100).toFixed(1)}%)`;

                // =================================
                // 클래스별 확률 출력
                // =================================

                const heading =
                    document.createElement("h3");

                heading.textContent =
                    "📊 동물상별 인식 결과";

                labelContainer.appendChild(heading);

                sortedPrediction.forEach(
                    function(item) {

                        const className =
                            item.className;

                        const score =
                            item.probability;

                        const percent =
                            Math.max(
                                0,
                                Math.min(100, score * 100)
                            );

                        const div =
                            document.createElement("div");

                        div.className = "result-item";

                        const title =
                            document.createElement("div");

                        title.className =
                            "result-title";

                        const name =
                            document.createElement("span");

                        name.textContent = className;

                        const value =
                            document.createElement("strong");

                        value.textContent =
                            percent.toFixed(1) + "%";

                        title.appendChild(name);
                        title.appendChild(value);

                        const progress =
                            document.createElement("div");

                        progress.className = "progress";

                        const bar =
                            document.createElement("div");

                        bar.className = "progress-bar";

                        bar.style.width =
                            percent + "%";

                        progress.appendChild(bar);

                        div.appendChild(title);
                        div.appendChild(progress);

                        labelContainer.appendChild(div);

                    }
                );

                status.textContent =
                    "분석이 완료되었습니다!";

                console.log(
                    "최종 동물상:",
                    animal
                );

                console.log(
                    "최종 확률:",
                    probability * 100
                );

            } catch (error) {

                console.error(
                    "이미지 분석 오류:",
                    error
                );

                status.textContent =
                    "이미지 분석에 실패했습니다.";

                alert(
                    "이미지 분석 중 오류가 발생했습니다."
                );

            } finally {

                isAnalyzing = false;

                updateButton();

            }

        }


        // =====================================
        // 8. 분석 버튼 이벤트
        // =====================================

        analyzeButton.addEventListener(
            "click",
            predictImage
        );


        // =====================================
        // 9. 페이지 실행
        // =====================================

        init();


    </script>

</body>
</html>
