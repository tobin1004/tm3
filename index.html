
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>인물별 동물상 테스트</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <!-- Teachable Machine 이미지 분류 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
            background-color: #f5f7fa;
        }

        h2 {
            color: #333;
        }

        p {
            color: #555;
        }

        #preview {
            margin: 20px auto;
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            display: none;
            object-fit: contain;
        }

        button {
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #3366cc;
            color: white;
        }

        button:hover {
            background-color: #254f9e;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #status {
            margin: 15px;
            color: #666;
            font-size: 14px;
        }

        #result {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #3366cc;
        }

        #label-container {
            margin: 25px auto;
            max-width: 400px;
            font-size: 16px;
            text-align: left;
        }

        .result-item {
            margin: 15px 0;
        }

        .result-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .progress {
            width: 100%;
            height: 18px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: #4caf50;
            transition: width 0.4s;
        }
    </style>
</head>

<body>

    <h2>🐶 동물상 테스트 🦊</h2>

    <p>이미지를 업로드하면 어떤 동물상인지 알려드립니다.</p>

    <!-- 이미지 업로드 -->
    <input
        type="file"
        id="image-upload"
        accept="image/*"
    >

    <br>

    <!-- 이미지 미리보기 -->
    <img id="preview" alt="업로드 이미지 미리보기">

    <br>

    <!-- 분석 버튼 -->
    <button
        type="button"
        id="analyze-button"
        onclick="predictImage()"
        disabled
    >
        동물상 분석하기
    </button>

    <!-- 모델 로딩 상태 -->
    <div id="status">AI 모델을 불러오는 중입니다...</div>

    <!-- 최종 판별 결과 -->
    <div id="result"></div>

    <!-- 클래스별 예측 확률 -->
    <div id="label-container"></div>


    <script>

        // =====================================
        // 1. Teachable Machine 모델 경로
        // =====================================

        // URL은 브라우저의 기본 객체 이름이므로
        // MODEL_URL이라는 별도 변수명을 사용합니다.

        const MODEL_URL = "./my_model/";

        let model = null;


        // =====================================
        // 2. 모델 불러오기
        // =====================================

        async function init() {

            const status = document.getElementById("status");
            const button = document.getElementById("analyze-button");

            try {

                const modelURL = MODEL_URL + "model.json";
                const metadataURL = MODEL_URL + "metadata.json";

                // Teachable Machine 모델 로딩
                model = await tmImage.load(
                    modelURL,
                    metadataURL
                );

                status.innerHTML = "모델 로딩 완료! 이미지를 업로드하세요.";

                button.disabled = false;

                console.log("AI 모델 로딩 완료");

            } catch (error) {

                status.innerHTML = "모델 로딩 실패! 모델 폴더를 확인하세요.";

                console.error("모델 로딩 오류:", error);

                alert("AI 모델을 불러오지 못했습니다.");
            }
        }


        // =====================================
        // 3. 이미지 업로드 및 미리보기
        // =====================================

        document.getElementById("image-upload")
            .addEventListener("change", function(event) {

                const file = event.target.files[0];

                if (!file) return;

                // 이미지 파일인지 확인
                if (!file.type.startsWith("image/")) {

                    alert("이미지 파일만 업로드할 수 있습니다.");

                    event.target.value = "";
                    return;
                }

                const image = document.getElementById("preview");

                // 이전에 생성한 임시 URL 해제
                if (image.dataset.objectUrl) {
                    window.URL.revokeObjectURL(
                        image.dataset.objectUrl
                    );
                }

                // 업로드 이미지의 임시 URL 생성
                const objectUrl = window.URL.createObjectURL(file);

                image.dataset.objectUrl = objectUrl;
                image.src = objectUrl;

                image.style.display = "block";

                // 이전 분석 결과 초기화
                document.getElementById("result").innerHTML = "";

                document.getElementById("label-container").innerHTML = "";

                document.getElementById("status").innerHTML =
                    "이미지가 업로드되었습니다.";

            });


        // =====================================
        // 4. 이미지 분석
        // =====================================

        async function predictImage() {

            const image = document.getElementById("preview");

            const button = document.getElementById("analyze-button");

            const result = document.getElementById("result");

            const labelContainer =
                document.getElementById("label-container");


            // 모델 로딩 여부 확인
            if (!model) {

                alert("AI 모델을 불러오는 중입니다.");

                return;
            }


            // 이미지 업로드 여부 확인
            if (
                !image.src ||
                !image.complete ||
                image.naturalWidth === 0
            ) {

                alert("먼저 이미지를 업로드하세요.");

                return;
            }


            try {

                // 분석 중 버튼 비활성화
                button.disabled = true;

                document.getElementById("status").innerHTML =
                    "AI가 이미지를 분석하고 있습니다...";


                // =====================================
                // 이미지 분류 실행
                // =====================================

                const prediction = await model.predict(image);


                // =====================================
                // 가장 높은 확률의 클래스 찾기
                // =====================================

                let bestPrediction = prediction[0];

                for (let i = 1; i < prediction.length; i++) {

                    if (
                        prediction[i].probability >
                        bestPrediction.probability
                    ) {

                        bestPrediction = prediction[i];

                    }

                }


                // 클래스 이름과 확률
                const animal = bestPrediction.className;

                const probability = bestPrediction.probability;


                // =====================================
                // 최종 결과 출력
                // =====================================

                result.innerHTML =
                    `당신은 "${animal}"상입니다!<br>
                    (${(probability * 100).toFixed(1)}% 확률)`;


                // =====================================
                // 클래스별 예측 확률 출력
                // =====================================

                labelContainer.innerHTML =
                    "<h3>📊 분류별 인식 결과</h3>";


                for (let i = 0; i < prediction.length; i++) {

                    const className =
                        prediction[i].className;

                    const score =
                        prediction[i].probability;

                    const percent =
                        (score * 100).toFixed(1);


                    // 결과 항목 생성
                    const div = document.createElement("div");

                    div.className = "result-item";


                    // 클래스 이름과 확률
                    div.innerHTML = `
                        <div class="result-title">
                            <span>${className}</span>
                            <strong>${percent}%</strong>
                        </div>

                        <div class="progress">
                            <div
                                class="progress-bar"
                                style="width: ${percent}%">
                            </div>
                        </div>
                    `;


                    labelContainer.appendChild(div);

                }


                document.getElementById("status").innerHTML =
                    "분석이 완료되었습니다!";


            } catch (error) {

                console.error("이미지 분석 오류:", error);

                alert("이미지 분석 중 오류가 발생했습니다.");

                document.getElementById("status").innerHTML =
                    "이미지 분석에 실패했습니다.";

            } finally {

                // 분석 종료 후 버튼 활성화
                button.disabled = false;

            }

        }


        // =====================================
        // 5. 페이지가 열리면 모델 불러오기
        // =====================================

        init();


    </script>

</body>
</html>
